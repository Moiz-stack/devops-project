name: Bugfix PR Validation

on:
  pull_request:
    branches:
      - release
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate-bugfix:
    name: Validate Bugfix PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Run Static Code Analysis
        run: |
          npm run lint || echo "Linting errors found!" 
