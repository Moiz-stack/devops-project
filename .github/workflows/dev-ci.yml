name: Development CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "**.html"
      - "**.css"
      - "**.js"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Linter (HTMLHint & Stylelint)
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"

      - name: Build Project
        run: |
          echo "Building Project..."
          mkdir build
          rsync -av --exclude 'build/' . build/
