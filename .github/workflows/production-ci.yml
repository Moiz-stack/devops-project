name: Production Deployment

on:
  push:
    branches:
      - production
    paths:
      - "**.html"
      - "**.css"
      - "**.js"

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Linter (HTMLHint & Stylelint)
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"

      - name: Build Project
        run: |
          echo "Building Project..."
          mkdir build
          cp -r * build/

      - name: Deploy to Production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deploying to Production..."
          # Add actual deployment commands here (e.g., Firebase, Netlify, GitHub Pages, etc.)
